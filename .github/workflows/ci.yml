name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The ggerganov/whisper.cpp revision the Whisper models are downloaded from.
  WHISPER_MODELS_REVISION: 5359861c739e955e79d9a303bcbc70fb988958b1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The ffmpeg LocalTake ships: the tests run against it.
      - name: Fetch the shipped ffmpeg
        shell: bash
        run: |
          bash build/fetch-ffmpeg.sh windows "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
      # The smallest Whisper model, for the transcription tests (skipped without one). Pinned and checked.
      - name: Download a Whisper model for the tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o ggml-tiny.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/$WHISPER_MODELS_REVISION/ggml-tiny.bin"
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" > ggml-tiny.bin.sha256
          if command -v sha256sum > /dev/null; then sha256sum -c ggml-tiny.bin.sha256; else shasum -a 256 -c ggml-tiny.bin.sha256; fi
          echo "LOCALTAKE_WHISPER_MODEL=$RUNNER_TEMP/ggml-tiny.bin" >> "$GITHUB_ENV"
      - name: Format
        run: dotnet format LocalTake.slnx --verify-no-changes
      - name: Build
        run: dotnet build LocalTake.slnx -c Release
      - name: Test
        run: dotnet test --solution LocalTake.slnx -c Release --no-build

  # The portable projects (core, infrastructure, platform adapters) on Linux and macOS.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # On macOS, the ffmpeg LocalTake ships, which the tests then run against; Linux has no LocalTake app.
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            bash build/fetch-ffmpeg.sh macos "$RUNNER_TEMP/ffmpeg"
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      # The smallest Whisper model, for the transcription tests (skipped without one). Pinned and checked.
      - name: Download a Whisper model for the tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o ggml-tiny.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/$WHISPER_MODELS_REVISION/ggml-tiny.bin"
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" > ggml-tiny.bin.sha256
          if command -v sha256sum > /dev/null; then sha256sum -c ggml-tiny.bin.sha256; else shasum -a 256 -c ggml-tiny.bin.sha256; fi
          echo "LOCALTAKE_WHISPER_MODEL=$RUNNER_TEMP/ggml-tiny.bin" >> "$GITHUB_ENV"
      - name: Core tests with coverage
        run: dotnet test --project tests/LocalTake.Core.Tests -c Release --coverage --coverage-output-format cobertura --coverage-output core.cobertura.xml
      - name: Core coverage of at least 90 %
        run: python3 build/check-coverage.py TestResults/core.cobertura.xml 90
      - name: Integration tests
        run: dotnet test --project tests/LocalTake.Infrastructure.IntegrationTests -c Release
      - name: Platform tests
        run: dotnet test --project tests/LocalTake.Platform.Tests -c Release

  # The macOS app, universal (Apple silicon and Intel), with ffmpeg, signed with the LocalTake certificate when the
  # secrets are set (ad hoc otherwise), to try out on a Mac.
  macos-app:
    runs-on: macos-26
    env:
      # Each .NET for macOS requires one Xcode. Workload set 10.0.401 holds .NET for macOS 26.5.10318, which builds with
      # Xcode 26.6; the newer sets want an Xcode this runner does not have yet. Change both together.
      MACOS_WORKLOAD_SET: 10.0.401
      XCODE: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install the macOS workload
        run: dotnet workload install macos --version "$MACOS_WORKLOAD_SET"
      - name: Build
        run: dotnet build src/LocalTake.Mac -c Release
      - name: Format
        run: dotnet format LocalTake.Mac.slnx --verify-no-changes
      - name: Add ffmpeg, sign and zip
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: bash build/package-macos.sh src/LocalTake.Mac/bin/Release/net10.0-macos/LocalTake.app dist/LocalTake-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LocalTake-macos
          path: dist/LocalTake-macos.zip

  # The Windows build to try out.
  package-windows:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # LocalTake.exe, Whisper's native libraries (runtimes\win-x64), ffmpeg.exe and the licence notices; without the
      # model, which only releases ship.
      - name: Publish LocalTake.exe
        run: dotnet publish src/LocalTake.Windows -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist
      - name: Add ffmpeg and the licence notices
        shell: bash
        run: |
          bash build/fetch-ffmpeg.sh windows dist
          cp THIRD-PARTY-NOTICES.md dist/
          cp -r licenses dist/
          test -f dist/LocalTake.exe && test -f dist/ffmpeg.exe && test -f dist/licenses/GPL-3.0.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LocalTake-windows
          path: dist/
