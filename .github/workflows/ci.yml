name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Format
        run: dotnet format LocalTake.slnx --verify-no-changes
      - name: Build
        run: dotnet build LocalTake.slnx -c Release
      - name: Test
        run: dotnet test --solution LocalTake.slnx -c Release --no-build

  # The portable projects (core, infrastructure, platform adapters) on Linux and macOS.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Core tests with coverage
        run: dotnet test --project tests/LocalTake.Core.Tests -c Release --coverage --coverage-output-format cobertura --coverage-output core.cobertura.xml
      - name: Core coverage of at least 90 %
        run: python3 build/check-coverage.py TestResults/core.cobertura.xml 90
      - name: Integration tests
        run: dotnet test --project tests/LocalTake.Infrastructure.IntegrationTests -c Release
      - name: Platform tests
        run: dotnet test --project tests/LocalTake.Platform.Tests -c Release

  # The macOS app, universal (Apple silicon and Intel), signed ad hoc, to try out on a Mac.
  macos-app:
    runs-on: macos-26
    env:
      # Each .NET for macOS requires one Xcode. Workload set 10.0.401 holds .NET for macOS 26.5.10318, which builds with
      # Xcode 26.6; the newer sets want an Xcode this runner does not have yet. Change both together.
      MACOS_WORKLOAD_SET: 10.0.401
      XCODE: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install the macOS workload
        run: dotnet workload install macos --version "$MACOS_WORKLOAD_SET"
      - name: Format
        run: dotnet format LocalTake.Mac.slnx --verify-no-changes
      - name: Build
        run: dotnet build src/LocalTake.Mac -c Release
      - name: Sign ad hoc and zip
        run: |
          # Each architecture is built in its own folder (osx-arm64, osx-x64), then merged into the universal app here.
          ls src/LocalTake.Mac/bin/Release/net10.0-macos
          app=src/LocalTake.Mac/bin/Release/net10.0-macos/LocalTake.app
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          archs="$(lipo -archs "$app/Contents/MacOS/LocalTake")"
          echo "$archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/LocalTake-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LocalTake-macos
          path: dist/LocalTake-macos.zip

  # The Windows build to try out.
  package-windows:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish LocalTake.exe
        run: dotnet publish src/LocalTake.Windows -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: LocalTake-windows
          path: dist/LocalTake.exe
