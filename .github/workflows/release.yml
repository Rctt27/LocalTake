name: Release

# Pushing a tag vX.Y.Z on main builds LocalTake for Windows and macOS and publishes both as a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet publish src/LocalTake.Windows -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist
      - name: Name the executable after the version
        shell: bash
        run: mv dist/LocalTake.exe "dist/LocalTake-${GITHUB_REF_NAME#v}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  # The same build as the CI's macos-app job; keep the workload set and Xcode in step with it.
  macos:
    runs-on: macos-26
    env:
      MACOS_WORKLOAD_SET: 10.0.401
      XCODE: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo xcode-select -s "$XCODE"
      - run: dotnet workload install macos --version "$MACOS_WORKLOAD_SET"
      - run: dotnet build src/LocalTake.Mac -c Release
      - name: Sign ad hoc and zip, named after the version
        run: |
          app=src/LocalTake.Mac/bin/Release/net10.0-macos/LocalTake.app
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          archs="$(lipo -archs "$app/Contents/MacOS/LocalTake")"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/LocalTake-${GITHUB_REF_NAME#v}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match <Version> in Directory.Build.props" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "LocalTake $version" --generate-notes
